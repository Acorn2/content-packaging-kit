<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>自然博物馆：视频与封面对照</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f8f3e8; color: #263c49; font-family: -apple-system, "PingFang SC", sans-serif; }
    main { max-width: 90rem; margin: auto; padding: 1.5rem 1.125rem; }
    h1 { margin: 0 0 .75rem; font-size: 1.5rem; line-height: 1.4; }
    .intro { max-width: 72ch; margin: 0 0 2rem; color: #53646a; line-height: 1.8; }
    .comparison { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2rem; align-items: start; }
    figure { margin: 0; min-width: 0; }
    h2 { margin: 0 0 .875rem; font-size: 1.1875rem; }
    video, .cover { display: block; width: 100%; height: auto; background: #ece7db; }
    video { aspect-ratio: 16 / 9; }
    .cover { aspect-ratio: 4 / 3; }
    figcaption { margin-top: .875rem; font-size: 1rem; line-height: 1.8; color: #53646a; }
    .links { display: flex; gap: .5rem 1.375rem; flex-wrap: wrap; margin-top: 1rem; }
    a { color: #3b687d; text-underline-offset: 4px; }
    .links a { display: inline-flex; align-items: center; min-height: 2.75rem; }
    a:focus-visible { outline: 2px solid #3b687d; outline-offset: 5px; }
    footer { margin-top: 2.25rem; font-size: .875rem; line-height: 1.8; color: #53646a; }
    @media (min-width: 64rem) { main { padding: 2.25rem 1.75rem; } h1 { font-size: 1.75rem; } .comparison { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
  </style>
</head>
<body>
  <main>
    <h1>自然博物馆：从视频内容到封面</h1>
    <p class="intro">这里展示用户提供的约68秒亲子科普视频，以及本项目制作的4:3封面。点击视频播放，对照内容如何被提炼成标题与视觉主体。</p>
    <div class="comparison">
      <figure>
        <h2>输入视频</h2>
        <video controls playsinline preload="metadata" poster="video-poster.jpg" aria-label="自然博物馆亲子科普视频">
          <source src="nature-museum-narrated.mp4" type="video/mp4">
          当前浏览器不支持视频播放，可使用下方链接下载视频。
        </video>
        <figcaption>1920×1080 · 约68.17秒 · H.264 / AAC。预览图来自视频约20秒处。</figcaption>
        <nav class="links" aria-label="视频文件"><a href="nature-museum-narrated.mp4" download>下载输入视频</a></nav>
      </figure>
      <figure>
        <h2>输出封面</h2>
        <a href="cover-4x3.png"><img class="cover" src="cover-4x3.png" width="1600" height="1200" alt="把自然博物馆搬进家里：暖米色背景、宋体标题、蝴蝶与毛毛虫的4:3封面"></a>
        <figcaption>1600×1200 · 宋体精修版。内容主体为主，保留案例账号的轻量署名；本例未制作3:4。</figcaption>
        <nav class="links" aria-label="封面文件"><a href="cover-4x3.png" download>下载封面原图</a><a href="README.md">案例说明</a></nav>
      </figure>
    </div>
    <footer>视频是输入素材，本 Skill 负责封面制作。本例展示参考与迭代后的视觉效果，无发布或点击数据；通用固定模板命令不会原样生成此宋体精修版。</footer>
  </main>
</body>
</html>
