interface:
  display_name: "爆款标题、发布文案与视频封面"
  short_description: "生成强宣传标题与五平台文案，封面按内容选择主体与人物，保持账号风格，支持可选署名、双比例与本地定稿"
  default_prompt: "使用 $social-creator-toolkit，根据我的资料生成指定平台发布包；封面默认内容为主、风格统一，按选题决定人物是否参与表达，不自动加头像或Logo，用户明确选择和已确认账号规范优先；品牌名使用我的输入或账号规范，无品牌时不署名；沿用满意参考及适用的固定模板（主标题与底线倾斜−2°、辅助文字水平），做好4:3和3:4封面，按我的确认导出。"
